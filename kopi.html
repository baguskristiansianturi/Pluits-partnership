<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Kopi & Minuman — PLUITS Partner</title>
<style>
:root{--teal:#079b8e;--ink:#172f36;--muted:#75858a;--line:#e7edeb;--bg:#f5f8f7;--soft:#edf8f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 960px)/2))}
.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:14px}.mark{width:30px;height:30px;border-radius:10px;background:#e9f7f4;color:var(--teal);display:grid;place-items:center;font-size:21px}.brand span{color:var(--teal)}a{color:inherit;text-decoration:none}.back{border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:#536c70;font-size:11px;font-weight:750;background:#fff}
main{max-width:680px;margin:28px auto;padding:0 16px 48px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 35px #183b3509}
.kicker{font-size:9px;letter-spacing:.14em;font-weight:850;color:var(--teal);margin:0 0 8px}.hero{display:flex;align-items:center;gap:15px;margin-bottom:18px}.icon{width:62px;height:62px;flex:none;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:32px}.hero h1{font-size:26px;letter-spacing:-.045em;margin:0 0 5px}.hero p{font-size:12px;line-height:1.55;color:var(--muted);margin:0}
label.field{display:block;font-size:10px;font-weight:800;color:#63777a;margin:14px 0 6px}input[type=text]{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;font-size:12px;outline:none}input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #079b8e16}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.choice{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:11px;font-weight:700;cursor:pointer}.choice:has(input:checked){border-color:var(--teal);background:#f1faf7}.choice input{accent-color:var(--teal)}
button.primary{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;background:var(--teal);color:white;font-size:12px;font-weight:850;cursor:pointer}
.note{margin:14px 0 0;padding:11px;border-radius:10px;background:#f6f8f7;color:#7b8c8e;font-size:9px;line-height:1.5}
.result{display:none;margin-top:14px;padding:13px;border:1px solid #cfe9df;background:#f2faf7;border-radius:12px;font-size:11px;line-height:1.55}.result.show{display:block}.result b{display:block;margin-bottom:4px}
@media(max-width:520px){main{margin:14px auto}.panel{padding:17px;border-radius:17px}.hero h1{font-size:23px}}
</style>
</head>
<body>
<header><a class="brand" href="./index.html"><span class="mark">p</span><span>PLUITS <span>Partner</span></span></a><a class="back" href="./index.html">‹ Beranda</a></header>
<main><section class="panel">
<p class="kicker">PLUITS COFFEE</p>
<div class="hero"><div class="icon">☕</div><div><h1>Kopi & Minuman</h1><p>Temukan kopi, teh, minuman, dan camilan.</p></div></div>
<form id="serviceForm">

<label class="field">Pilih kebutuhan</label>
<div class="choices"><label class="choice"><input type="radio" name="choice" value="Kopi" checked><span>Kopi</span></label>
<label class="choice"><input type="radio" name="choice" value="Teh" ><span>Teh</span></label>
<label class="choice"><input type="radio" name="choice" value="Minuman dingin" ><span>Minuman dingin</span></label>
<label class="choice"><input type="radio" name="choice" value="Camilan" ><span>Camilan</span></label></div>
<button class="primary" type="submit">Pilih minuman</button>
</form>
<div class="result" id="result" role="status" aria-live="polite"></div>
<p class="note">Daftar pilihan adalah pratinjau, belum terhubung ke merchant.</p>
</section></main>
<script>
document.getElementById('serviceForm').addEventListener('submit',function(event){
 event.preventDefault();
 const required=[...this.querySelectorAll('input[type=text]')];
 const missing=required.find(input=>!input.value.trim());
 const result=document.getElementById('result');
 if(missing){missing.focus();result.className='result show';result.innerHTML='<b>Lengkapi alamat terlebih dahulu</b>Masukkan '+missing.previousElementSibling.textContent.toLowerCase()+'.';return;}
 const selected=this.querySelector('input[name=choice]:checked')?.value||'Pilihan belum ditentukan';
 result.className='result show';
 result.innerHTML='<b>Detail '+"Kopi & Minuman"+' disiapkan</b>'+''+'Pilihan: '+selected+'. Ini masih pratinjau lokal, belum dikirim ke mitra.';
});
</script>
</body></html>
